[versions]
agp = "8.13.2"
kotlin = "2.3.20"
compose = "1.10.3"
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.11.0"
miuix = "0.8.8"
okhttp = "4.12.0"
kotlinxSerialization = "1.9.0"
androidxWebkit = "1.14.0"
camerax = "1.6.2"
mlkitBarcode = "17.3.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version.ref = "androidxWebkit" }

# Miuix — Xiaomi HyperOS design language for Compose.
#
# Version note (verified against Maven Central metadata, 2026-10):
#   * the `miuix` umbrella artifact tracks the 0.8.x line; 0.8.8 is the latest.
#     Its POM pins Compose Multiplatform foundation 1.10.3 and Kotlin stdlib
#     2.3.20, so this project matches those exactly.
#   * the 0.9.x line publishes only sub-modules (core / blur / icons), with no
#     matching umbrella artifact — mixing them in would resolve two Compose
#     foundations. Hence the single, consistent 0.8.8 line below.
miuix = { group = "top.yukonga.miuix.kmp", name = "miuix", version.ref = "miuix" }
miuix-icons = { group = "top.yukonga.miuix.kmp", name = "miuix-icons", version.ref = "miuix" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# QR scanning for the pairing link.
#
# CameraX for the preview/analysis pipeline and ML Kit's bundled barcode model for
# decoding. ML Kit is used rather than ZXing because the bundled variant ships the
# model inside the APK — ZXing needs the user to have Google Play services for the
# equivalent, and this app must work on a bare HyperOS device.
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
mlkit-barcode = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
