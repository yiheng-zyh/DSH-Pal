# Keep the daemon modest: this project builds fine in ~1.5 GB, and a smaller cap
# leaves headroom so a build can never squeeze the rest of the machine. The Kotlin
# compiler runs in its own process with the same ceiling.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# Keep Gradle's own state under the project when the user home contains
# non-ASCII characters: the Windows test worker cannot otherwise resolve its
# own bootstrap class (ClassNotFoundException: GradleWorkerMain), because the
# generated classpath is mangled by the ANSI round-trip.
org.gradle.projectcachedir=.gradle-project-cache

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
