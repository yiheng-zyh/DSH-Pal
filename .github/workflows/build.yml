name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Prepare native SDK, test and assemble debug APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # windows-latest 自带 Android SDK（ANDROID_HOME 已设置），不再用
      # android-actions/setup-android@v3：它会执行已被移除的 `sdkmanager tools`
      # 包而整步失败。这里只按需补齐缺少的 platform / build-tools。
      - name: Install SDK platform
        shell: pwsh
        run: |
          $sdkmanager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          if (-not (Test-Path $sdkmanager)) {
            $sdkmanager = (Get-ChildItem -Path (Join-Path $env:ANDROID_HOME 'cmdline-tools') -Filter sdkmanager.bat -Recurse -ErrorAction Stop | Select-Object -First 1).FullName
          }
          Write-Host "sdkmanager: $sdkmanager"
          Write-Host "ANDROID_HOME: $env:ANDROID_HOME"
          & $sdkmanager --version
          $existing = & $sdkmanager --list_installed
          $existing | Write-Host
          if (-not ($existing -match 'platforms;android-36')) {
            & $sdkmanager --install 'platforms;android-36'
          }
          if (-not ($existing -match 'build-tools;36\.0\.0')) {
            & $sdkmanager --install 'build-tools;36.0.0'
          }
          if ($LASTEXITCODE -ne 0) { throw "sdkmanager failed with exit code $LASTEXITCODE" }

      - name: Prepare pinned Tailscale JNI library
        shell: pwsh
        run: ./tools/prepare-tailscale-sdk.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check injected layouts
        run: |
          node tools/test-web-layout-syntax.mjs
          node tools/test-web-right-layout.mjs
          node tools/test-web-drawer.mjs
          node tools/test-web-viewport.mjs

      - name: Check connection recovery and startup probe
        run: |
          node tools/test-browser-health.mjs
          node tools/test-connection-recovery.mjs
          node tools/test-page-ready.mjs

      - name: Assemble
        run: ./gradlew.bat :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
