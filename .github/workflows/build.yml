name: Build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    name: Prepare native SDK, test and assemble debug APK
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare pinned Tailscale JNI library
        shell: pwsh
        run: ./tools/prepare-tailscale-sdk.ps1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check injected layouts
        run: |
          node tools/test-web-layout-syntax.mjs
          node tools/test-web-right-layout.mjs
          node tools/test-web-drawer.mjs
          node tools/test-web-viewport.mjs

      - name: Assemble
        run: ./gradlew.bat :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
